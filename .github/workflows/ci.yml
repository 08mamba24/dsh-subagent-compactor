# Validate the live-only distribution on an unmodified, pinned Harness tree.
# No host patches, release tags, npm publication, or deployment are performed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock:
    name: stock Harness 0.2.2-rc.1 — 46 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install the unmodified npm runtime tree
        run: npm ci --include=dev
      - name: Unit, batch, live integration, and preset suites
        run: npm test
      - name: Check the source distribution contents
        run: npm pack --dry-run
